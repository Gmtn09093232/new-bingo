<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2AABEE" />
<meta name="description" content="Bingo — Telegram Mini App" />
<title>Bingo</title>

<!-- Telegram WebApp SDK — must load BEFORE our app.js -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Supabase JS v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
/* =========================================================================
 * THEME TOKENS
 * app.js overrides --tg-* at runtime from Telegram.WebApp.themeParams.
 * The fallbacks below give sane colours in a plain browser.
 * =======================================================================*/
:root {
  --tg-bg:            #ffffff;
  --tg-secondary-bg:  #f1f3f5;
  --tg-text:          #1c1c1e;
  --tg-hint:          #8e8e93;
  --tg-link:          #2AABEE;
  --tg-button:        #2AABEE;
  --tg-button-text:   #ffffff;
  --tg-header-bg:     #ffffff;
  --tg-accent:        #2AABEE;

  --radius-sm: 8px;
  --radius:    14px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow:    0 6px 20px rgba(0,0,0,.08);
  --shadow-lg: 0 14px 40px rgba(0,0,0,.18);

  --ok:      #22c55e;
  --warn:    #f59e0b;
  --danger:  #ef4444;
  --info:    #3b82f6;

  --bingo-b: #3B82F6;
  --bingo-i: #EF4444;
  --bingo-n: #10B981;
  --bingo-g: #F59E0B;
  --bingo-o: #8B5CF6;

  --nav-h: 62px;
  --header-h: 72px;
}

/* Dark-scheme fallbacks when Telegram isn't present */
@media (prefers-color-scheme: dark) {
  :root {
    --tg-bg:           #17212b;
    --tg-secondary-bg: #232e3c;
    --tg-text:         #ffffff;
    --tg-hint:         #7d8b99;
    --tg-header-bg:    #17212b;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  height: 100%;
  overscroll-behavior: none;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--tg-bg);
  color: var(--tg-text);
  font-size: 15px;
  line-height: 1.4;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font: inherit; }

/* =========================================================================
 * APP SHELL
 * =======================================================================*/
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding-top: env(safe-area-inset-top, 0);
}

/* --- Header --- */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  background: var(--tg-header-bg);
  border-bottom: 1px solid rgba(128,128,128,.12);
  min-height: var(--header-h);
  flex-shrink: 0;
}
.player-id {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.player-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--tg-button);
  color: var(--tg-button-text);
  display: grid; place-items: center;
  font-weight: 700;
  font-size: 16px;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.15);
}
.player-text { min-width: 0; }
.player-text .hello {
  font-size: 11px;
  color: var(--tg-hint);
  letter-spacing: .5px;
  text-transform: uppercase;
}
.player-text #player-name {
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
}
.header-balance {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.header-balance span {
  font-size: 10px;
  color: var(--tg-hint);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.header-balance #player-balance {
  font-weight: 700;
  font-size: 14px;
  color: var(--tg-accent);
}
.notif-btn {
  position: relative;
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 18px;
  background: var(--tg-secondary-bg);
  margin-left: 4px;
}
#notif-badge {
  position: absolute;
  top: -2px; right: -2px;
  min-width: 18px; height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  display: none;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--tg-header-bg);
}
#notif-badge.show { display: flex; }

/* --- Views --- */
.views {
  flex: 1;
  position: relative;
  overflow: hidden;
}
.view {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  padding-bottom: 24px;
  display: none;
}
.view.active { display: block; }

/* --- Bottom Navigation --- */
.bottom-nav {
  display: flex;
  justify-content: space-around;
  align-items: stretch;
  background: var(--tg-header-bg);
  border-top: 1px solid rgba(128,128,128,.12);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0));
  padding-bottom: env(safe-area-inset-bottom, 0);
  flex-shrink: 0;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10px;
  color: var(--tg-hint);
  transition: color .15s ease;
  position: relative;
}
.nav-item .nav-ico {
  font-size: 20px;
  line-height: 1;
  transition: transform .15s ease;
}
.nav-item.active {
  color: var(--tg-button);
}
.nav-item.active .nav-ico { transform: translateY(-1px) scale(1.08); }
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0; left: 20%; right: 20%;
  height: 3px;
  border-radius: 0 0 3px 3px;
  background: var(--tg-button);
}

/* =========================================================================
 * PRIMITIVES
 * =======================================================================*/
.section-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--tg-hint);
  margin: 20px 0 10px;
}
.section-title:first-child { margin-top: 0; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 14px;
  transition: transform .1s ease, opacity .15s ease, background .15s ease;
  min-height: 46px;
  user-select: none;
}
.btn:active { transform: scale(.97); }
.btn:disabled, .btn.busy {
  opacity: .5;
  cursor: not-allowed;
  pointer-events: none;
}
.btn.primary {
  background: var(--tg-button);
  color: var(--tg-button-text);
  box-shadow: var(--shadow-sm);
}
.btn.ghost {
  background: var(--tg-secondary-bg);
  color: var(--tg-text);
  border: 1px solid rgba(128,128,128,.15);
}
.btn.danger {
  background: rgba(239,68,68,.12);
  color: var(--danger);
  border: 1px solid rgba(239,68,68,.25);
}
.btn.block { width: 100%; }

.empty, .muted {
  color: var(--tg-hint);
  font-size: 14px;
  text-align: center;
  padding: 24px 8px;
}
.muted { padding: 4px 0; text-align: left; }

/* =========================================================================
 * LOBBY
 * =======================================================================*/
.lobby-greeting {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: linear-gradient(135deg, var(--tg-button) 0%, #5856D6 100%);
  color: #fff;
  border-radius: var(--radius-lg);
  margin-bottom: 8px;
  box-shadow: var(--shadow);
}
.lobby-greeting .hello {
  font-size: 12px;
  opacity: .8;
  letter-spacing: .5px;
}
.lobby-greeting .name {
  font-size: 20px;
  font-weight: 700;
  margin-top: 2px;
}
.wallet-chip {
  background: rgba(255,255,255,.18);
  backdrop-filter: blur(10px);
  padding: 8px 14px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}
.wallet-chip span {
  font-size: 10px;
  opacity: .85;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.wallet-chip b { font-size: 14px; }

.room-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.room-card {
  background: var(--tg-secondary-bg);
  border-radius: var(--radius);
  padding: 14px;
  border: 1px solid rgba(128,128,128,.08);
  transition: transform .12s ease, border-color .2s ease;
}
.room-card:active { transform: scale(.99); }
.room-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}
.room-stake {
  font-size: 22px;
  font-weight: 800;
  color: var(--tg-text);
  letter-spacing: -.5px;
}
.room-count {
  font-size: 12px;
  color: var(--tg-hint);
  background: var(--tg-bg);
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 600;
}
.room-body {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.room-prize {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.room-prize .label {
  font-size: 10px;
  color: var(--tg-hint);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.room-prize .value {
  font-size: 16px;
  font-weight: 700;
  color: var(--ok);
}
.room-prize .hint {
  font-size: 11px;
  color: var(--tg-hint);
}
.room-body .join-btn {
  padding: 10px 22px;
  min-height: 40px;
  font-size: 13px;
  letter-spacing: .5px;
  flex-shrink: 0;
}

/* =========================================================================
 * GAME VIEW
 * =======================================================================*/
.game-header {
  background: var(--tg-secondary-bg);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 14px;
}
.game-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 16px;
}
.game-meta .row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 13px;
}
.game-meta .row span { color: var(--tg-hint); }
.game-meta .row b { font-weight: 700; }
.status-LOBBY     { color: var(--info); }
.status-STARTING  { color: var(--warn); }
.status-ACTIVE    { color: var(--ok); }
.status-FINISHED,
.status-SETTLED   { color: var(--tg-accent); }
.status-CANCELLED,
.status-REFUNDING { color: var(--danger); }

/* --- Lobby countdown --- */
.countdown-block {
  text-align: center;
  padding: 22px 12px;
  background: var(--tg-secondary-bg);
  border-radius: var(--radius);
  margin-bottom: 14px;
}
.countdown-label {
  font-size: 11px;
  color: var(--tg-hint);
  letter-spacing: 2px;
  font-weight: 600;
}
.countdown-value {
  font-size: 52px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--tg-accent);
  letter-spacing: -2px;
  line-height: 1.05;
  margin: 6px 0 4px;
}
.countdown-hint { font-size: 12px; color: var(--tg-hint); }

.players-block {
  background: var(--tg-secondary-bg);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 14px;
}
.players-block h4 {
  margin: 0 0 10px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--tg-hint);
}
.players-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 260px;
  overflow-y: auto;
}
.player-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: var(--tg-bg);
  border-radius: 10px;
  border: 1px solid transparent;
}
.player-chip.me {
  border-color: var(--tg-button);
  background: color-mix(in srgb, var(--tg-button) 10%, var(--tg-bg));
}
.pc-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--tg-button);
  color: var(--tg-button-text);
  display: grid; place-items: center;
  font-size: 12px;
  font-weight: 700;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}
.pc-name {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pc-handle {
  color: var(--tg-hint);
  font-weight: 400;
  font-size: 12px;
  margin-left: 4px;
}
.pc-card {
  font-size: 11px;
  font-weight: 700;
  color: var(--tg-accent);
  background: var(--tg-secondary-bg);
  padding: 3px 8px;
  border-radius: 8px;
  font-variant-numeric: tabular-nums;
}

/* --- Current call --- */
.current-call {
  text-align: center;
  padding: 18px 12px;
  background: var(--tg-secondary-bg);
  border-radius: var(--radius);
  margin-bottom: 14px;
}
.current-label {
  font-size: 11px;
  color: var(--tg-hint);
  letter-spacing: 2px;
  font-weight: 600;
  margin-bottom: 10px;
}
.ball {
  width: 108px; height: 108px;
  border-radius: 50%;
  margin: 0 auto 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: 0 8px 24px rgba(0,0,0,.22), inset -6px -6px 14px rgba(0,0,0,.15), inset 6px 6px 12px rgba(255,255,255,.2);
  animation: ballIn .35s cubic-bezier(.2,1.4,.5,1);
}
.ball.placeholder {
  background: var(--tg-bg);
  color: var(--tg-hint);
  box-shadow: inset 0 0 0 3px rgba(128,128,128,.15);
}
.ball-letter {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  opacity: .9;
  line-height: 1;
}
.ball-number {
  font-size: 42px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -1px;
}
@keyframes ballIn {
  from { transform: scale(.7); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}
.next-label {
  font-size: 13px;
  color: var(--tg-hint);
}
.next-label b {
  color: var(--tg-text);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* --- Called numbers --- */
.called-block {
  background: var(--tg-secondary-bg);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 14px;
}
.called-block h4 {
  margin: 0 0 10px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--tg-hint);
}
.called-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 120px;
  overflow-y: auto;
}
.called-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 9px;
  border-radius: 999px;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  box-shadow: var(--shadow-sm);
  animation: chipIn .25s ease;
}
@keyframes chipIn {
  from { transform: scale(.6); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}

/* --- Bingo card --- */
.card-block {
  background: var(--tg-secondary-bg);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 14px;
}
.card-block h4 {
  margin: 0 0 10px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--tg-hint);
}
.bingo-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: var(--tg-bg);
  padding: 8px;
  border-radius: 12px;
}
.bingo-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
}
.bingo-cell {
  aspect-ratio: 1 / 1;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--tg-secondary-bg);
  font-weight: 600;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
  color: var(--tg-text);
  transition: background .2s ease, transform .15s ease, color .2s ease;
  user-select: none;
}
.bingo-cell.head {
  color: #fff;
  font-weight: 800;
  aspect-ratio: auto;
  padding: 6px 0;
  font-size: 12px;
  letter-spacing: 1px;
}
.bingo-cell.marked {
  background: var(--tg-button);
  color: var(--tg-button-text);
  transform: scale(1.03);
  box-shadow: 0 3px 10px color-mix(in srgb, var(--tg-button) 40%, transparent);
}
.bingo-cell.free {
  background: var(--bingo-n);
  color: #fff;
  font-size: 20px;
}

.bingo-btn {
  width: 100%;
  background: linear-gradient(135deg, #EF4444 0%, #F59E0B 100%);
  color: #fff;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 2px;
  padding: 20px;
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(239,68,68,.35);
  animation: pulse 2s infinite;
}
.bingo-btn:disabled { animation: none; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 8px 24px rgba(239,68,68,.35); }
  50%      { box-shadow: 0 8px 32px rgba(239,68,68,.6); }
}

/* --- Winner / cancel blocks --- */
.winner-block, .cancel-block {
  text-align: center;
  padding: 30px 16px;
  background: var(--tg-secondary-bg);
  border-radius: var(--radius);
  animation: winnerIn .4s ease;
}
.winner-block.me {
  background: linear-gradient(135deg, rgba(34,197,94,.15), rgba(59,130,246,.15));
  border: 2px solid var(--ok);
}
.winner-emoji {
  font-size: 56px;
  line-height: 1;
  margin-bottom: 8px;
  animation: bounce 1.4s infinite;
}
@keyframes winnerIn {
  from { transform: scale(.9); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
.winner-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.winner-line {
  font-size: 15px;
  color: var(--tg-hint);
  margin: 4px 0;
}
.winner-line b {
  color: var(--tg-text);
  font-weight: 700;
}
.winner-hint {
  margin-top: 14px;
  font-size: 12px;
  color: var(--tg-hint);
}

/* =========================================================================
 * WALLET
 * =======================================================================*/
.wallet-hero {
  background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  color: #fff;
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  text-align: center;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.wallet-label {
  font-size: 12px;
  opacity: .85;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.wallet-value {
  font-size: 34px;
  font-weight: 800;
  margin-top: 6px;
  letter-spacing: -1px;
}
.wallet-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 8px;
}

.tx-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tx-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--tg-secondary-bg);
  border-radius: var(--radius-sm);
}
.tx-left { min-width: 0; flex: 1; }
.tx-type {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.tx-type.tx-deposit    { color: var(--ok); }
.tx-type.tx-prize      { color: var(--ok); }
.tx-type.tx-refund     { color: var(--info); }
.tx-type.tx-bonus      { color: var(--info); }
.tx-type.tx-stake      { color: var(--warn); }
.tx-type.tx-withdrawal { color: var(--danger); }
.tx-type.tx-adjustment { color: var(--tg-accent); }
.tx-date {
  font-size: 11px;
  color: var(--tg-hint);
  margin-top: 2px;
}
.tx-note {
  font-size: 11px;
  color: var(--tg-hint);
  font-style: italic;
  margin-top: 2px;
}
.tx-right {
  text-align: right;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.tx-right.pos { color: var(--ok); }
.tx-right.neg { color: var(--danger); }
.tx-bal {
  font-size: 10px;
  font-weight: 500;
  color: var(--tg-hint);
  margin-top: 2px;
}

/* =========================================================================
 * PROFILE
 * =======================================================================*/
.profile-head {
  text-align: center;
  padding: 20px 12px 16px;
}
.avatar-lg {
  width: 88px; height: 88px;
  border-radius: 50%;
  margin: 0 auto 12px;
  background: var(--tg-button);
  color: var(--tg-button-text);
  display: grid; place-items: center;
  font-size: 34px;
  font-weight: 700;
  background-size: cover;
  background-position: center;
  box-shadow: var(--shadow);
  border: 3px solid var(--tg-secondary-bg);
}
.profile-name {
  font-size: 20px;
  font-weight: 700;
}
.profile-username {
  font-size: 13px;
  color: var(--tg-hint);
  margin-top: 2px;
}

.kv-list {
  background: var(--tg-secondary-bg);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 14px;
}
.kv {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid rgba(128,128,128,.08);
  font-size: 13px;
}
.kv:last-child { border-bottom: none; }
.kv span { color: var(--tg-hint); }
.kv b {
  font-weight: 600;
  text-align: right;
  word-break: break-all;
}

/* =========================================================================
 * HISTORY
 * =======================================================================*/
.history-filters {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.chip {
  padding: 7px 16px;
  border-radius: 999px;
  background: var(--tg-secondary-bg);
  color: var(--tg-hint);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: all .15s ease;
}
.chip.active {
  background: var(--tg-button);
  color: var(--tg-button-text);
}
.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.history-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--tg-secondary-bg);
  border-radius: var(--radius);
}
.history-main { min-width: 0; flex: 1; }
.history-title {
  font-weight: 700;
  font-size: 14px;
}
.history-sub {
  font-size: 11px;
  color: var(--tg-hint);
  margin-top: 2px;
}
.history-result {
  text-align: right;
  flex-shrink: 0;
}
.result-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
}
.result-badge.win     { background: rgba(34,197,94,.15);  color: var(--ok); }
.result-badge.loss    { background: rgba(239,68,68,.12);  color: var(--danger); }
.result-badge.neutral { background: rgba(128,128,128,.15); color: var(--tg-hint); }
.history-amounts {
  font-size: 11px;
  color: var(--tg-hint);
  margin-top: 4px;
  line-height: 1.35;
  font-variant-numeric: tabular-nums;
}

/* =========================================================================
 * CARD SELECTION MODAL
 * =======================================================================*/
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(4px);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 1000;
  padding: 0;
}
.modal.open { display: flex; }
.modal-card {
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  background: var(--tg-bg);
  border-radius: 24px 24px 0 0;
  padding: 22px 18px calc(18px + env(safe-area-inset-bottom, 0));
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: sheetUp .25s cubic-bezier(.2,.9,.4,1);
  overflow-y: auto;
}
@keyframes sheetUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.modal-head h3 {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  flex: 1;
}
.modal-close {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--tg-secondary-bg);
  display: grid; place-items: center;
  font-size: 18px;
  color: var(--tg-hint);
  flex-shrink: 0;
}
.modal-status {
  font-size: 12px;
  color: var(--tg-hint);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
#card-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  max-height: 44vh;
  overflow-y: auto;
  padding: 4px;
}
.card-num {
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  display: grid;
  place-items: center;
  transition: all .15s ease;
  background: var(--tg-secondary-bg);
  color: var(--tg-text);
}
.card-num.free { background: rgba(34,197,94,.15); color: var(--ok); }
.card-num.taken {
  background: rgba(239,68,68,.12);
  color: var(--danger);
  opacity: .55;
  text-decoration: line-through;
  cursor: not-allowed;
}
.card-num.selected {
  background: var(--tg-button);
  color: var(--tg-button-text);
  transform: scale(1.06);
  box-shadow: 0 6px 18px color-mix(in srgb, var(--tg-button) 40%, transparent);
}
.card-num:not(.taken):active { transform: scale(.95); }

#card-confirm {
  width: 100%;
  padding: 16px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .5px;
  margin-top: 4px;
}

/* =========================================================================
 * TOAST
 * =======================================================================*/
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0));
  transform: translate(-50%, 30px);
  max-width: 88vw;
  padding: 12px 18px;
  border-radius: 12px;
  background: rgba(28,28,30,.95);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 2000;
  text-align: center;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.toast.success { background: rgba(34,197,94,.96); }
.toast.error   { background: rgba(239,68,68,.96); }
.toast.info    { background: rgba(28,28,30,.96); }

/* =========================================================================
 * LOADING BOOT SKELETON
 * =======================================================================*/
#boot {
  position: fixed;
  inset: 0;
  background: var(--tg-bg);
  display: grid;
  place-items: center;
  z-index: 3000;
  color: var(--tg-hint);
  transition: opacity .35s ease;
}
#boot.hidden {
  opacity: 0;
  pointer-events: none;
}
.boot-spinner {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 4px solid var(--tg-secondary-bg);
  border-top-color: var(--tg-button);
  animation: spin .9s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.boot-text {
  text-align: center;
  font-size: 13px;
}

/* =========================================================================
 * RESPONSIVE TWEAKS
 * =======================================================================*/
@media (max-width: 340px) {
  .countdown-value { font-size: 42px; }
  .ball { width: 92px; height: 92px; }
  .ball-number { font-size: 34px; }
  .room-stake { font-size: 19px; }
}
</style>
</head>

<body>

<!-- =====================================================================
     BOOT SPLASH
     Removed by app.js once authentication + initial load complete.
     ===================================================================== -->
<div id="boot">
  <div>
    <div class="boot-spinner"></div>
    <div class="boot-text">Loading Bingo…</div>
  </div>
</div>

<!-- =====================================================================
     APP SHELL
     ===================================================================== -->
<div id="app">

  <!-- ---------------------------------------------------------------- -->
  <!-- HEADER                                                           -->
  <!-- ---------------------------------------------------------------- -->
  <header class="app-header">
    <div class="player-id">
      <div class="player-avatar" id="player-avatar">·</div>
      <div class="player-text">
        <div class="hello">Player</div>
        <div id="player-name">…</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;">
      <div class="header-balance">
        <span>Balance</span>
        <div id="player-balance">0.00 ETB</div>
      </div>
      <button class="notif-btn" id="notif-btn" aria-label="Notifications">
        🔔
        <span id="notif-badge">0</span>
      </button>
    </div>
  </header>

  <!-- ---------------------------------------------------------------- -->
  <!-- VIEWS                                                            -->
  <!-- ---------------------------------------------------------------- -->
  <main class="views">

    <!-- LOBBY -------------------------------------------------------- -->
    <section class="view active" data-view="lobby" id="lobby-view">
      <!-- Rendered by app.js #renderLobby() -->
    </section>

    <!-- GAME --------------------------------------------------------- -->
    <section class="view" data-view="game" id="game-view">
      <!-- Rendered by app.js #renderGame() -->
    </section>

    <!-- WALLET ------------------------------------------------------- -->
    <section class="view" data-view="wallet" id="wallet-view">
      <!-- Rendered by app.js #renderWallet() -->
    </section>

    <!-- PROFILE ------------------------------------------------------ -->
    <section class="view" data-view="profile" id="profile-view">
      <!-- Rendered by app.js #renderProfile() -->
    </section>

    <!-- HISTORY ------------------------------------------------------ -->
    <section class="view" data-view="history" id="history-view">
      <!-- Rendered by app.js #renderHistory() -->
    </section>

  </main>

  <!-- ---------------------------------------------------------------- -->
  <!-- BOTTOM NAVIGATION                                                -->
  <!-- ---------------------------------------------------------------- -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-nav="lobby">
      <span class="nav-ico">🏠</span>
      <span>Lobby</span>
    </button>
    <button class="nav-item" data-nav="game">
      <span class="nav-ico">🎯</span>
      <span>Game</span>
    </button>
    <button class="nav-item" data-nav="wallet">
      <span class="nav-ico">💰</span>
      <span>Wallet</span>
    </button>
    <button class="nav-item" data-nav="profile">
      <span class="nav-ico">👤</span>
      <span>Profile</span>
    </button>
    <button class="nav-item" data-nav="history">
      <span class="nav-ico">📜</span>
      <span>History</span>
    </button>
  </nav>
</div>

<!-- =====================================================================
     CARD SELECTION MODAL
     app.js opens this from #openCardSelection() and renders the grid.
     ===================================================================== -->
<div class="modal" id="card-modal" role="dialog" aria-modal="true" aria-labelledby="card-modal-title">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="card-modal-title">Select your card</h3>
      <button class="modal-close" id="card-modal-close" aria-label="Close">✕</button>
    </div>

    <div id="card-grid">
      <!-- Rendered by app.js -->
    </div>

    <div class="modal-status" id="card-modal-status">
      Loading available cards…
    </div>

    <button class="btn primary" id="card-confirm" disabled>
      SELECT A CARD
    </button>
  </div>
</div>

<!-- =====================================================================
     TOAST
     ===================================================================== -->
<div id="toast" class="toast" aria-live="polite"></div>

<!-- =====================================================================
     GLOBAL CONFIG
     Fill these in from your Supabase project. The bot token is NEVER
     placed here — it lives only in the Edge Function's environment.
     ===================================================================== -->
<script>
  window.__APP_MODE__       = 'player';
  window.SUPABASE_URL       = 'https://YOUR-PROJECT.supabase.co';
  window.SUPABASE_ANON_KEY  = 'YOUR-ANON-KEY';
  // Optional: override the auto-derived URL
  // window.TELEGRAM_AUTH_URL = 'https://YOUR-PROJECT.functions.supabase.co/telegram-auth';
</script>

<!-- =====================================================================
     APPLICATION CODE
     ===================================================================== -->
<script src="app.js"></script>

<!-- =====================================================================
     POST-BOOT: hide splash once app.js signals readiness.
     app.js sets State.booted = true at the end of bootPlayerApp().
     We poll briefly, then fade out.
     ===================================================================== -->
<script>
  (function hideBoot() {
    let tries = 0;
    const tick = setInterval(() => {
      const done = window.BingoApp?.State?.booted;
      if (done || tries > 40) {          // ~20 s safety cap
        clearInterval(tick);
        const el = document.getElementById('boot');
        if (el) {
          el.classList.add('hidden');
          setTimeout(() => el.remove(), 400);
        }
      }
      tries++;
    }, 500);
  })();
</script>

</body>
</html>
